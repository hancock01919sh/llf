# Deploys `dev` to Render after CI passes on a push (TDD §9.3, D27). Render's own auto-deploy is off
# in render.yaml, so a red build never reaches the dev URL. Each service gets the exact commit CI
# tested, then scripts/render-deploy.mjs smoke-tests the live URLs.
#
# Render builds from a deploy mirror in ddd's EMU org (dotdotdash-OMC), because its GitHub link
# can't fetch this repo (TDD §9.1, D30). This job pushes the tested tree to the mirror first, minus
# .github/workflows (the mirror's deploy key may not change workflow files, and Render doesn't need them),
# as a new commit on the mirror's `dev` whose message names the source commit. That commit is deployed.
#
# Setup (docs/runbooks/render-dev.md): GitHub environment `dev` with secrets RENDER_API_KEY and
# RENDER_MIRROR_DEPLOY_KEY, and variables RENDER_MIRROR_REPO, RENDER_SERVICE_ID_CMS_DEV,
# RENDER_SERVICE_ID_TIPS_DEV, RENDER_SERVICE_ID_WEB_DEV.
name: Deploy dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render dev
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.web_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Push the tested tree to the Render deploy mirror
        id: mirror
        env:
          MIRROR_KEY: ${{ secrets.RENDER_MIRROR_DEPLOY_KEY }}
          MIRROR_REPO: ${{ vars.RENDER_MIRROR_REPO }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$MIRROR_KEY" ] || [ -z "$MIRROR_REPO" ]; then
            echo "Mirror not configured; skipping the push (docs/runbooks/render-dev.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/mirror_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MIRROR_KEY" > "$key"
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          url="git@github.com:${MIRROR_REPO}.git"
          parent=()
          if git fetch --quiet --depth=1 "$url" dev; then parent=(-p FETCH_HEAD); fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/mirror-index"
          git read-tree "$SOURCE_SHA"
          git rm -r -q --cached --ignore-unmatch .github/workflows
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          commit=$(git -c user.name="Deploy dev" -c user.email="deploy-dev@users.noreply.github.com" \
            commit-tree "$tree" "${parent[@]}" -m "Deploy ${GITHUB_REPOSITORY}@${SOURCE_SHA}")
          git push --quiet "$url" "${commit}:refs/heads/dev"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "Mirror commit \`${commit:0:7}\` = \`${SOURCE_SHA:0:7}\` without .github/workflows." >> "$GITHUB_STEP_SUMMARY"
      - id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_SHA: ${{ steps.mirror.outputs.sha }}
          RENDER_SERVICE_ID_CMS: ${{ vars.RENDER_SERVICE_ID_CMS_DEV }}
          RENDER_SERVICE_ID_TIPS: ${{ vars.RENDER_SERVICE_ID_TIPS_DEV }}
          RENDER_SERVICE_ID_WEB: ${{ vars.RENDER_SERVICE_ID_WEB_DEV }}
          RENDER_SERVICE_ID_RELAY: ${{ vars.RENDER_SERVICE_ID_RELAY_DEV }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY is not set on the dev environment yet; skipping (docs/runbooks/render-dev.md)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/render-deploy.mjs
