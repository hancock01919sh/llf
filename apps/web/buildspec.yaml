version: 0.2

env:
  variables:
    DOCKER_BUILDKIT: '1'

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub...
      - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USER --password-stdin
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - NOW=$(date +"%Y%m%d%H%M%S")
  build:
    on-failure: ABORT
    commands:
      - echo Build started on `date`
      - echo Building the Docker web image...
      - docker build --platform linux/arm64 -f apps/web/Dockerfile -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - echo Build completed on `date`
  post_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - echo Tagging the Docker Image...
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG.$COMMIT_HASH.$NOW
      - echo Pushing the Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG.$COMMIT_HASH.$NOW
      - printf '{"ImageURI":"%s:%s.%s.%s"}' $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME $IMAGE_TAG $COMMIT_HASH $NOW > imageDetail.json

artifacts:
  files:
    - imageDetail.json
